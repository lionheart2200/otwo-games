<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>الأحماض والقواعد</title>
<link rel="stylesheet" href="../shared/otwo.css">
<style>
  .lv { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; cursor: pointer; color: var(--text); font: inherit; }
  .lv .i { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; flex: none;
    box-shadow: 0 4px 0 rgba(0,0,0,.4); }
  .lv b { display: block; font-size: 15.5px; } .lv span { font-size: 12px; color: var(--muted); }
  .stage { position: relative; min-height: 150px; display: grid; place-items: center; margin-bottom: 12px; }
  .cmp { width: 78%; max-width: 330px; padding: 16px 12px; border-radius: 20px; text-align: center; touch-action: none; cursor: grab;
    background: linear-gradient(160deg, #ffd166, #f59e0b); color: #3d2a00; box-shadow: 0 6px 0 #8a5a00, 0 16px 26px rgba(245,158,11,.3);
    position: relative; z-index: 5; }
  .cmp.drag { cursor: grabbing; transition: none; }
  .cmp:not(.drag) { transition: transform .25s; }
  .cmp .f { font-size: 30px; font-weight: 900; direction: ltr; line-height: 1.2; }
  .cmp .n { font-size: 15px; font-weight: 800; }
  .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
  .bin { border-radius: 20px; padding: 20px 6px; text-align: center; cursor: pointer; border: 2px dashed; font-weight: 900; font-size: 18px;
    transition: transform .15s, background .15s; }
  .bin .e { font-size: 34px; display: block; }
  .bin.hot { transform: scale(1.06); }
  .fb { min-height: 48px; text-align: center; font-weight: 800; font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="../shared/otwo.js"></script>
<script src="data.js"></script>
<script>
'use strict';
/* الأحماض والقواعد — 3 مستويات. اسحب بطاقة المركّب إلى السلّة الصحيحة (أو اضغط على السلّة). */
const ALL = (window.OTWO_DATA && window.OTWO_DATA.compounds) || [];
const LEVELS = [
  { key: 'acidBase', title: 'المستوى الأول: أحماض وقواعد', sub: 'صنّف المركّب: حمض أم قاعدة؟', ico: '🧪', col: '#00b4d8',
    pool: () => ALL.filter((c) => c.type), field: 'type',
    bins: [['acid', 'حمض', '🍋', '#ef476f'], ['base', 'قاعدة', '🧼', '#4d9fff']],
    word: (c) => c.type === 'acid' ? 'حمض' : 'قاعدة' },
  { key: 'acidStrength', title: 'المستوى الثاني: قوة الأحماض', sub: 'هل الحمض قوي أم ضعيف؟', ico: '⚡', col: '#ef476f',
    pool: () => ALL.filter((c) => c.type === 'acid' && c.strength), field: 'strength',
    bins: [['strong', 'قوي', '💪', '#ffb703'], ['weak', 'ضعيف', '🌱', '#06d6a0']],
    word: (c) => 'حمض ' + (c.strength === 'strong' ? 'قوي' : 'ضعيف') },
  { key: 'baseStrength', title: 'المستوى الثالث: قوة القواعد', sub: 'هل القاعدة قوية أم ضعيفة؟', ico: '🔋', col: '#7c3aed',
    pool: () => ALL.filter((c) => c.type === 'base' && c.strength), field: 'strength',
    bins: [['strong', 'قوية', '💪', '#ffb703'], ['weak', 'ضعيفة', '🌱', '#06d6a0']],
    word: (c) => 'قاعدة ' + (c.strength === 'strong' ? 'قوية' : 'ضعيفة') },
];
const HELP = ['اسحب بطاقة المركّب إلى السلّة الصحيحة، أو اضغط على السلّة مباشرة.',
  'كل إجابة صحيحة = 10 نقاط. كل جولة 10 مركّبات.',
  'الأحماض القوية تتأيّن كلياً في الماء (مثل HCl)، والضعيفة جزئياً (مثل CH₃COOH).'];
const app = OT.$('#app');
let L, round, i, score, right, wrong, locked;
const bestKey = (k) => 'ot_acid_' + k;
const best = (k) => { try { return +localStorage.getItem(bestKey(k)) || 0; } catch (_) { return 0; } };

function menu() {
  round = null;
  app.innerHTML = '';
  app.appendChild(OT.topbar('الأحماض والقواعد', HELP));
  app.insertAdjacentHTML('beforeend', `<div class="center" style="padding:10px 0 14px"><div style="font-size:56px">⚗️</div>
    <p class="muted" style="margin:4px 0">اختر المستوى وابدأ التصنيف</p></div><div id="lv"></div>`);
  for (const lv of LEVELS) {
    const n = lv.pool().length;
    const b = OT.el('button', { class: 'card lv' }, `<div class="i" style="background:${lv.col}">${lv.ico}</div>
      <div style="flex:1"><b>${lv.title}</b><span>${lv.sub}</span></div>
      ${best(lv.key) ? `<span class="chip gold">🏅 ${best(lv.key)}</span>` : '<div>▶</div>'}`);
    b.onclick = () => n ? start(lv) : OT.toast('لا توجد مركّبات كافية لهذا المستوى. أضِفها في ملف data.js.', 'bad');
    OT.$('#lv').appendChild(b);
  }
}
function start(lv) {
  L = lv; round = OT.shuffle(lv.pool()).slice(0, 10); i = 0; score = 0; right = 0; wrong = 0;
  app.innerHTML = '';
  app.appendChild(OT.topbar(lv.title, HELP));
  app.insertAdjacentHTML('beforeend', `
    <div class="stats"><div class="stat"><b id="sQ"></b><span>المركّب</span></div><div class="stat"><b id="sS">0</b><span>النقاط</span></div>
      <div class="stat"><b id="sR" style="color:var(--success)">0</b><span>صحيح</span></div><div class="stat"><b id="sW" style="color:var(--error)">0</b><span>خطأ</span></div></div>
    <div class="bar" style="margin-bottom:10px"><i id="prog"></i></div>
    <div class="stage"><div class="cmp" id="cmp"></div></div>
    <div class="bins" id="bins"></div><div class="fb" id="fb"></div>
    <button class="btn ghost" id="bMenu">◀ المستويات</button>`);
  for (const [val, label, emo, col] of lv.bins) {
    const b = OT.el('div', { class: 'bin', 'data-v': val }, `<span class="e">${emo}</span>${label}`);
    b.style.borderColor = col; b.style.color = col; b.style.background = col + '1c';
    b.onclick = () => drop(val);
    OT.$('#bins').appendChild(b);
  }
  OT.$('#bMenu').onclick = menu;
  dragSetup(); show();
}
function show() {
  locked = false;
  const c = round[i], el = OT.$('#cmp');
  el.style.transform = ''; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  el.innerHTML = `<div class="f">${OT.esc(c.nameEn || '')}</div><div class="n">${OT.esc(c.nameAr)}</div>`;
  OT.$('#sQ').textContent = `${i + 1} / ${round.length}`; OT.$('#prog').style.width = (i / round.length * 100) + '%';
  OT.$('#fb').innerHTML = '<span class="muted" style="font-weight:600">اسحب البطاقة إلى السلّة الصحيحة 👇</span>';
}
function drop(val) {
  if (locked) return; locked = true;
  const c = round[i], ok = c[L.field] === val;
  const msg = `${OT.esc(c.nameAr)} ${L.word(c)}.`;
  if (ok) { score += 10; right++; OT.sfx.ok(); OT.$('#fb').innerHTML = `<span style="color:var(--success)">✅ أحسنت! ${msg}</span>`; }
  else { wrong++; OT.sfx.bad(); OT.$('#cmp').classList.add('shake'); OT.$('#fb').innerHTML = `<span style="color:var(--error)">❌ خطأ. ${msg}</span>`; }
  OT.$('#sS').textContent = score; OT.$('#sR').textContent = right; OT.$('#sW').textContent = wrong;
  const r0 = round; setTimeout(() => { if (round !== r0 || !OT.$('#cmp')) return; OT.$('#cmp').classList.remove('shake'); if (i < round.length - 1) { i++; show(); } else finish(); }, 1400);
}
function finish() {
  const isBest = score > best(L.key), pct = Math.round(right / round.length * 100);
  if (isBest) { try { localStorage.setItem(bestKey(L.key), score); } catch (_) {} }
  if (pct >= 70) { OT.confetti(); OT.sfx.win(); }
  OT.modal({ icon: pct === 100 ? '🏆' : pct >= 70 ? '🌟' : '📚', title: isBest ? 'رقم قياسي جديد!' : 'انتهت الجولة',
    lines: [`النقاط: <b style="color:var(--accent)">${score}</b>`, `صحيح: <b>${right}</b> — خطأ: <b>${wrong}</b> (${pct}%)`],
    buttons: [{ label: 'المستويات', cls: 'ghost', onClick: menu }, { label: 'أعد المستوى', cls: 'gold', onClick: () => start(L) }] });
}
/* سحب البطاقة بالإصبع أو الفأرة — الإفلات فوق سلّة يختارها. */
function dragSetup() {
  const el = OT.$('#cmp'); let sx, sy, on = false;
  const binAt = (x, y) => OT.$$('.bin').find((b) => { const r = b.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
  el.addEventListener('pointerdown', (e) => { if (locked) return; on = true; sx = e.clientX; sy = e.clientY; el.classList.add('drag'); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', (e) => { if (!on) return;
    el.style.transform = `translate(${e.clientX - sx}px, ${e.clientY - sy}px) rotate(${(e.clientX - sx) / 30}deg)`;
    const h = binAt(e.clientX, e.clientY); for (const b of OT.$$('.bin')) b.classList.toggle('hot', b === h); });
  const up = (e) => { if (!on) return; on = false; el.classList.remove('drag');
    const h = binAt(e.clientX, e.clientY); for (const b of OT.$$('.bin')) b.classList.remove('hot');
    el.style.transform = ''; if (h) drop(h.dataset.v); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
if (!ALL.length) { app.appendChild(OT.topbar('الأحماض والقواعد')); app.insertAdjacentHTML('beforeend', '<div class="card center muted">لا توجد مركّبات. أضِفها في ملف data.js.</div>'); }
else menu();
</script>
</body>
</html>
