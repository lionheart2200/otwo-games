<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>محاكاة الغاز</title>
<link rel="stylesheet" href="../shared/otwo.css">
<style>
  canvas#cv { width: 100%; height: 250px; display: block; border-radius: 16px; background: #07101f;
    border: 1px solid rgba(0,180,216,.3); box-shadow: 0 5px 0 var(--edge); margin-bottom: 14px; }
  .ctl { margin-bottom: 12px; }
  .ctl label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .ctl label b { color: var(--primary); }
  input[type=range] { width: 100%; accent-color: var(--primary); height: 28px; direction: ltr; }
  .laws { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
  .laws button { flex: none; }
  .gauge { display: flex; align-items: center; gap: 12px; }
  .gauge canvas { width: 130px; height: 74px; flex: none; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-inline-end: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="../shared/otwo.js"></script>
<script>
'use strict';
/* محاكاة الغاز — جسيمات تتصادم مرونياً داخل وعاء.
   الضغط يُحسب فعلياً من دفع الجسيمات على الجدران، والحرارة من متوسط طاقتها الحركية. */
const app = OT.$('#app');
app.appendChild(OT.topbar('محاكاة الغاز', [
  'غيّر عدد الجسيمات، درجة الحرارة وحجم الوعاء، وراقب كيف يتغيّر الضغط.',
  'الضغط هنا ليس معادلة جاهزة: هو ناتج اصطدام الجسيمات بالجدران فعلاً.',
  'جرّب أزرار القوانين (بويل، شارل، أفوجادرو) لترى كل قانون وهو يعمل.',
]));
app.insertAdjacentHTML('beforeend', `
  <div class="stats">
    <div class="stat"><b id="vP">0.000</b><span>الضغط (atm)</span></div>
    <div class="stat"><b id="vV">0.00</b><span>الحجم (L)</span></div>
    <div class="stat"><b id="vT">0</b><span>الحرارة (K)</span></div>
    <div class="stat"><b id="vN">0</b><span>الجسيمات (mol)</span></div>
  </div>
  <canvas id="cv"></canvas>
  <div class="legend"><span><i class="dot" style="background:#4fc3f7"></i>جسيم خفيف (كتلة 1)</span>
    <span><i class="dot" style="background:#ffb74d"></i>جسيم ثقيل (كتلة 4)</span></div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn" id="bRun">⏸ إيقاف</button>
    <button class="btn ghost" id="bReset">↺ إعادة تعيين</button>
    <button class="btn ghost" id="bRand">🎲 عشوائي</button>
  </div>
  <div class="laws">
    <button class="btn ghost" data-law="boyle">قانون بويل (P و V)</button>
    <button class="btn ghost" data-law="charles">قانون جاي-لوساك (P و T)</button>
    <button class="btn ghost" data-law="avogadro">أفوجادرو (P و n)</button>
  </div>
  <div class="card">
    <div class="gauge" style="margin-bottom:10px"><canvas id="gg" width="260" height="148"></canvas>
      <div><b>مقياس الضغط (P)</b><div class="muted" style="font-size:12.5px" id="tip">حرّك المنزلقات وراقب المؤشّر.</div></div></div>
    <div class="ctl"><label>الجسيمات الخفيفة <b id="lL">40</b></label><input type="range" id="rL" min="0" max="150" step="10" value="40"></div>
    <div class="ctl"><label>الجسيمات الثقيلة <b id="lH">10</b></label><input type="range" id="rH" min="0" max="80" step="5" value="10"></div>
    <div class="ctl"><label>درجة الحرارة <b id="lT">300 K</b></label><input type="range" id="rT" min="50" max="1200" step="50" value="300"></div>
    <div class="ctl" style="margin:0"><label>حجم الوعاء <b id="lV">—</b></label><input type="range" id="rV" min="0.3" max="2.5" step="0.1" value="1"></div>
  </div>`);

const cv = OT.$('#cv'), g = cv.getContext('2d');
const W = { particles: [], light: 40, heavy: 10, T: 300, vf: 1, bounds: null, init: null, impulses: [], acc: 0, P: 0, temp: 0, vol: 1 };
const LM = 1, HM = 4, LR = 6, HR = 9, WIN = 0.5;
let running = true, last = 0, cw = 0, ch = 0;

function fit() {
  const dpr = window.devicePixelRatio || 1;
  cw = cv.clientWidth; ch = cv.clientHeight;
  cv.width = cw * dpr; cv.height = ch * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  W.init = { l: 12, t: 12, w: cw - 24, h: ch - 24 };
  setVolume(W.vf);
}
function setVolume(f) {
  W.vf = f;
  const n = OT.clamp((f - 0.3) / (2.5 - 0.3), 0, 1);
  const w = W.init.w * 0.2 + (W.init.w - W.init.w * 0.2) * n;
  const cx = W.init.l + W.init.w / 2;
  W.bounds = { l: cx - w / 2, r: cx + w / 2, t: W.init.t, b: W.init.t + W.init.h, w, h: W.init.h };
  W.vol = w * W.init.h / 10000;
  for (const p of W.particles) {
    p.x = OT.clamp(p.x, W.bounds.l + p.r, W.bounds.r - p.r);
    p.y = OT.clamp(p.y, W.bounds.t + p.r, W.bounds.b - p.r);
  }
}
const speedFor = (m) => Math.sqrt(W.T / 300) * (25 + Math.random() * 40) / Math.sqrt(m);
function make(m, r, color) {
  const b = W.bounds, a = Math.random() * Math.PI * 2, s = speedFor(m);
  return { x: b.l + r + Math.random() * Math.max(0, b.w - 2 * r), y: b.t + r + Math.random() * Math.max(0, b.h - 2 * r),
    vx: Math.cos(a) * s, vy: Math.sin(a) * s, m, r, color };
}
function rebuild() {
  W.particles = [];
  for (let i = 0; i < W.light; i++) W.particles.push(make(LM, LR, '#4fc3f7'));
  for (let i = 0; i < W.heavy; i++) W.particles.push(make(HM, HR, '#ffb74d'));
}
function setTemp(t) {
  const k = Math.sqrt(t / W.T); W.T = t;
  for (const p of W.particles) { p.vx *= k; p.vy *= k; }
}
function impulse(v) { v = Math.abs(v); if (v > 0) { W.impulses.push({ t: performance.now() / 1000, v }); W.acc += v; } }
function update(dt) {
  const b = W.bounds, ps = W.particles;
  if (!ps.length) { W.P = 0; W.temp = 0; return; }
  let sq = 0;
  for (const p of ps) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x - p.r < b.l) { p.x = b.l + p.r; impulse(p.m * 2 * p.vx); p.vx = -p.vx; }
    if (p.x + p.r > b.r) { p.x = b.r - p.r; impulse(p.m * 2 * p.vx); p.vx = -p.vx; }
    if (p.y - p.r < b.t) { p.y = b.t + p.r; impulse(p.m * 2 * p.vy); p.vy = -p.vy; }
    if (p.y + p.r > b.b) { p.y = b.b - p.r; impulse(p.m * 2 * p.vy); p.vy = -p.vy; }
    sq += p.vx * p.vx + p.vy * p.vy;
  }
  for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) collide(ps[i], ps[j]);
  W.temp = sq / ps.length * 0.5;
  const now = performance.now() / 1000;
  while (W.impulses.length && now - W.impulses[0].t > WIN) W.acc -= W.impulses.shift().v;
  const wall = 2 * (b.w + b.h);
  W.P = wall > 0 ? Math.max(0, W.acc) / (WIN * wall) * 0.5 : 0;
}
function collide(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy, md = a.r + b.r;
  if (d2 > md * md || d2 === 0) return;
  const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
  const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rel > 0) return;
  const j = -2 * rel / (1 / a.m + 1 / b.m);     // تصادم مرن تماماً
  a.vx -= j * nx / a.m; a.vy -= j * ny / a.m; b.vx += j * nx / b.m; b.vy += j * ny / b.m;
  const c = 0.5 * (md - d);
  a.x -= nx * c; a.y -= ny * c; b.x += nx * c; b.y += ny * c;
}
let pShown = 0;
function draw() {
  g.clearRect(0, 0, cw, ch);
  const b = W.bounds;
  g.fillStyle = 'rgba(0,180,216,.05)'; g.fillRect(b.l, b.t, b.w, b.h);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 3; g.strokeRect(b.l, b.t, b.w, b.h);
  for (const p of W.particles) {
    g.fillStyle = p.color; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.arc(p.x - p.r * .25, p.y - p.r * .25, p.r * .28, 0, 7); g.fill();
  }
  pShown += (W.P - pShown) * 0.08;      // تنعيم القراءة حتى لا يرتجف المؤشّر
  OT.$('#vP').textContent = pShown.toFixed(3);
  OT.$('#vV').textContent = W.vol.toFixed(2);
  OT.$('#vT').textContent = Math.round(W.T);
  OT.$('#vN').textContent = W.particles.length;
  OT.$('#lV').textContent = W.vol.toFixed(2) + ' L';
  gauge(OT.clamp(pShown / 1.0, 0, 1));
}
function gauge(t) {
  const c = OT.$('#gg'), x = c.getContext('2d'), cx = 130, cy = 132, r = 104;
  x.clearRect(0, 0, 260, 148);
  x.lineWidth = 16; x.lineCap = 'round';
  x.strokeStyle = 'rgba(255,255,255,.12)'; x.beginPath(); x.arc(cx, cy, r, Math.PI, 2 * Math.PI); x.stroke();
  const gr = x.createLinearGradient(26, 0, 234, 0);
  gr.addColorStop(0, '#06d6a0'); gr.addColorStop(.5, '#ffd166'); gr.addColorStop(1, '#ef476f');
  x.strokeStyle = gr; x.beginPath(); x.arc(cx, cy, r, Math.PI, Math.PI + Math.PI * Math.max(t, 0.001)); x.stroke();
  const a = Math.PI + Math.PI * t;
  x.strokeStyle = '#fff'; x.lineWidth = 4; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(a) * (r - 14), cy + Math.sin(a) * (r - 14)); x.stroke();
  x.fillStyle = '#fff'; x.beginPath(); x.arc(cx, cy, 7, 0, 7); x.fill();
}
function loop(ts) {
  const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts;
  if (running) update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ── التحكّم ──
const R = { L: OT.$('#rL'), H: OT.$('#rH'), T: OT.$('#rT'), V: OT.$('#rV') };
function sync() {
  OT.$('#lL').textContent = W.light; OT.$('#lH').textContent = W.heavy; OT.$('#lT').textContent = Math.round(W.T) + ' K';
  R.L.value = W.light; R.H.value = W.heavy; R.T.value = W.T; R.V.value = W.vf;
}
const tip = (s) => { OT.$('#tip').textContent = s; };
R.L.oninput = () => { W.light = +R.L.value; rebuild(); sync(); tip('جسيمات أكثر ← اصطدامات أكثر بالجدران ← ضغط أعلى.'); };
R.H.oninput = () => { W.heavy = +R.H.value; rebuild(); sync(); tip('الجسيم الثقيل أبطأ عند الحرارة نفسها، لكن دفعه للجدار أقوى.'); };
R.T.oninput = () => { setTemp(+R.T.value); sync(); tip('حرارة أعلى ← جسيمات أسرع ← ضغط أعلى (عند حجم ثابت).'); };
R.V.oninput = () => { setVolume(+R.V.value); tip('حجم أصغر ← الجسيمات تصطدم بالجدران أكثر ← ضغط أعلى (بويل).'); };
OT.$('#bRun').onclick = () => { running = !running; OT.$('#bRun').textContent = running ? '⏸ إيقاف' : '▶ ابدأ'; };
OT.$('#bReset').onclick = () => { W.light = 40; W.heavy = 10; W.T = 300; setVolume(1); rebuild(); W.impulses = []; W.acc = 0; sync(); tip('عادت القيم الافتراضية.'); };
OT.$('#bRand').onclick = () => { for (const p of W.particles) { const a = Math.random() * 6.283, s = speedFor(p.m); p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s; } };
const LAWS = {
  boyle: ['قانون بويل', 'عند ثبات الحرارة وعدد الجسيمات: كلما قلّ الحجم زاد الضغط (P ∝ 1/V).', 'حرّك منزلق «حجم الوعاء» ببطء وراقب مقياس الضغط.'],
  charles: ['قانون جاي-لوساك', 'عند ثبات الحجم وعدد الجسيمات: كلما زادت الحرارة زاد الضغط (P ∝ T).', 'حرّك منزلق «درجة الحرارة» وراقب سرعة الجسيمات والضغط.'],
  avogadro: ['علاقة أفوجادرو', 'عند ثبات الحجم والحرارة: كلما زاد عدد الجسيمات زاد الضغط (P ∝ n).', 'زِد «الجسيمات الخفيفة» وراقب الضغط.'],
};
for (const b of OT.$$('[data-law]')) b.onclick = () => { const [t, a, c] = LAWS[b.dataset.law];
  OT.modal({ icon: '⚗️', title: t, lines: [a, `<b style="color:var(--accent)">جرّب:</b> ${c}`], buttons: [{ label: 'لنجرّب' }] }); };

window.addEventListener('resize', fit);
fit(); rebuild(); sync(); requestAnimationFrame(loop);
</script>
</body>
</html>
